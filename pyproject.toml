[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ros2scope"
version = "0.1.0"
description = "ROS 2 telemetry dashboard: subscribe over rosbridge, record topics, inspect live rates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Rout" }]
keywords = ["flask", "service", "ros2_dashboard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    'Flask>=3.0',
    'Flask-SQLAlchemy>=3.1',
    'SQLAlchemy>=2.0',
    'PyYAML>=6.0',
    'websockets',
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.6",
  "pre-commit>=3.7",
  "types-PyYAML",
  "types-requests",
  "coverage>=7.5",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://example.invalid/ros2_dashboard"
Documentation = "https://example.invalid/ros2_dashboard/docs"
Issues = "https://example.invalid/ros2_dashboard/issues"

[project.scripts]
ros2scope = "ros2_dashboard.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ros2_dashboard = ["py.typed", "app.py", "http.py", "observability.py", "paths.py", "templates/*", "static/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q -ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]


# lint ignores — every rule below is a deliberate exception:
#   B007: the loop variable is intentionally unused
#   B017: the test asserts a broad failure on purpose
#   E501: line length is enforced by ruff format, not by the linter
#   N806: local names mirror the wire format
#   N818: exception names are public API and predate the Error-suffix rule
#   RUF046: the int() around round() is deliberate
#   S101: tests assert
#   S104: the service binds 0.0.0.0 by design
#   S105: test fixtures use obvious placeholder credentials
#   SIM115: the handle is closed by the caller that opens it
#   UP031: percent-formatting keeps logging arguments lazy
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "S", "RUF"]
ignore = [
  "B007",
  "B017",
  "E501",
  "N806",
  "N818",
  "RUF046",
  "S101",
  "S104",
  "S105",
  "SIM115",
  "UP031",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["ros2_dashboard"]
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["flask.*", "werkzeug.*", "sqlalchemy.*"]
ignore_missing_imports = true

[tool.bandit]
# Reviewed findings, each inherent to the architecture:
#   B104: the service binds 0.0.0.0 inside a container; the port is the contract
skips = ["B104"]
